services:
  - type: web
    name: bloom-focus-grow
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bloom-db
          property: connectionString
      - key: BLOOM_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.8

databases:
  - name: bloom-db
    plan: basic-256mb
